---
据点系统世界书:
  rule:
    - 当剧情涉及据点、基地、营地、设施建设、据点成员调度、仓库资源、生产收益、防御袭击、俘虏关押、贸易访客时，必须参考本条目。
    - 据点不是抽象资产，而是有地理位置、设施等级、成员分工、仓库物资、资金、安全压力与随机事件的实体。
    - 叙事应优先使用当前变量中的据点数据；不得无依据凭空增加高级设施、大量资源、高级成员或巨额资金。
    - 据点相关结果必须遵循“资源消耗—时间推进—成员执行—风险反馈—变量更新”的闭环。
  format: |-
    # 据点系统叙事与判定规则

    ## 1. 据点核心定位
    据点是玩家派系在废土中的固定资产，承担以下功能：
    - 储存：仓库保存食物、建材、铁原板、电子元件、钢筋、药品、武器、防具、贸易品等。
    - 生产：通过农场、矿场、精炼、锻造、酒馆、商铺等设施产生物资或 Cats。
    - 防御：通过大门、城墙、炮塔、驻防成员与地形抵御强盗、野兽、敌对派系和税务征收。
    - 居住：为成员、雇佣兵、囚犯、访客、伤员提供床铺和日常活动空间。
    - 剧情：据点会吸引商队、流浪者、逃犯、猎头者、传教士、税吏、奴隶贩子、赏金猎人、敌对侦察兵等。

    ## 2. 据点变量读取优先级
    当描述据点时，优先读取以下变量：
    - `/据点/{据点名}/等级`
    - `/据点/{据点名}/收益天数`
    - `/据点/{据点名}/所处区域`
    - `/据点/{据点名}/描述`
    - `/据点/{据点名}/资金`
    - `/据点/{据点名}/成员`
    - `/据点/{据点名}/仓库/物品`
    - `/据点/{据点名}/设施`
    - `/据点/{据点名}/到来事件`

    若变量中没有对应据点，应将其视为“尚未建立或未登记”，不能直接当作完整基地处理。

    ## 3. 据点等级含义
    - 1级：临时营地。只有基础墙体、火堆、睡袋、简易仓库或少量手工设施。容易被饥饿强盗、野兽、流民冲击。
    - 2级：小型前哨。拥有几座固定建筑、低级生产链、少量守卫与基础防御。可稳定自给部分食物或建材。
    - 3级：成熟据点。具备多设施协同、较完整仓库、固定劳动力和像样防御。会引来商队、税吏和敌对派系注意。
    - 4级：区域堡垒。高墙、炮塔、自动设施、工坊与医疗系统逐步完善。可以影响周边势力平衡。
    - 5级：城镇级据点。具有庞大生产、贸易、防御和人口承载力。会被视为独立政治实体或危险军阀据点。

    ## 4. 设施运作原则
    设施由“分类、等级、工作成员”决定效果：
    - 防御类设施：提升安全感、阻滞敌人、降低袭击损失，但需要维护材料。
    - 生产类设施：按天产出食物、建材、矿石、布料、酒水、大麻膏等，产量受等级、成员能力、环境影响。
    - 锻造类设施：产出武器、防具、电子元件、义肢或可出售商品，通常需要原料与较高技能。
    - 娱乐/贸易类设施：吸引访客、商队、雇佣兵或风险人物，能产生 Cats，但也更容易带来纠纷。
    - 囚禁类设施：容纳俘虏、赏金目标或敌对成员，可能引发越狱、赎金、招募、审讯或报复事件。
    - 基建类设施：提供居住容量、研究能力、床位、基础组织能力，是升级据点的前提。

    ## 5. 成员调度原则
    据点成员不是“免费劳动力”。分配工作时应考虑：
    - 角色属性与设施需求是否匹配。
    - 角色当前血量、创伤、装备、心理状态、忠诚度与人际关系。
    - 长期劳动会造成疲劳、饥饿、受伤、厌烦或技能成长。
    - 无人工作的设施应降低产出或停止运作。
    - 重要成员离开据点会削弱对应岗位效率或防御能力。

    ## 6. 仓库与资源消耗
    建设、升级、维修、生产、交易、治疗、招募都应消耗合理资源。
    常见消耗逻辑：
    - 建设/升级：建筑材料、铁原板、钢筋、电子元件、布料。
    - 食物供给：食物、烤肉、口粮包、面包、米饭、酒水。
    - 医疗恢复：医疗用品、床位、时间。
    - 防御战后维修：建筑材料、铁原板、钢筋。
    - 高科技设施：电子元件、古代科技书、AI核心或特殊遗物。

    不应在没有来源的情况下凭空补满仓库。若叙事中获得物资，需说明来源，例如贸易、劫掠、生产、任务报酬、拾荒、战利品。

    ## 7. 据点收益结算
    当时间推进到足够单位，或玩家主动要求结算收益时：
    - 根据设施等级和工作成员能力估算产出。
    - 将生产物加入 `/据点/{据点名}/仓库/物品` 或将贸易收益加入 `/据点/{据点名}/资金`。
    - 更新 `/据点/{据点名}/收益天数`。
    - 若发生停工、缺原料、缺人手、受袭、缺电、缺水、环境灾害，应降低收益或产生负面事件。

    收益结算应保持克制，避免单日暴富。高级设施可以高产，但应伴随维护成本、敌意关注或市场风险。

    ## 8. 据点事件生成
    据点事件应根据等级、区域、设施和当前剧情生成。事件可以写入 `/据点/{据点名}/到来事件`。

    常见事件类型：
    - 商队抵达：可购买材料、出售产品、招募护卫。
    - 流民求助：可能带来新成员、疾病、间谍或道德抉择。
    - 强盗勒索：要求食物或 Cats，拒绝则袭击。
    - 野兽徘徊：威胁农田、仓库、落单成员。
    - 税务征收：联合城、圣国或本地军阀要求纳贡。
    - 奴隶贩子出现：试图交易、绑架或追捕逃奴。
    - 技术故障：自动矿井、炮塔、水培设备、电子工坊停摆。
    - 成员矛盾：过劳、分赃、信仰、种族、俘虏处置引起冲突。
    - 俘虏越狱：囚禁设施不足或守卫薄弱时发生。
    - 敌对侦察：为后续大规模袭击埋伏笔。

    ## 9. 防御与袭击判定
    发生袭击时，叙事应考虑：
    - 据点等级、地形、墙门、炮塔、守卫数量。
    - 敌人类型、规模、动机和准备程度。
    - 玩家是否提前侦察、布防、谈判或转移物资。
    - 成员战斗能力、伤势、装备和士气。

    结果不应只写“胜利/失败”，应给出代价：
    - 成员受伤或立功。
    - 设施损坏或守住关键点。
    - 仓库损失、俘虏增加、声望变化。
    - 敌对派系好感度下降或后续报复。

    ## 10. 据点升级原则
    据点升级需要同时满足叙事和资源条件：
    - 足够资金或材料。
    - 关键基建设施达到要求。
    - 有成员投入建设或管理。
    - 时间推进合理。
    - 周边威胁没有完全压垮建设进度。

    升级后可扩展：
    - 更多设施容量。
    - 更高等级设施。
    - 更大成员规模。
    - 更强贸易吸引力。
    - 更高政治风险。

    ## 11. 变量更新要求
    当据点发生实质变化时，必须在回复末尾通过变量更新写入：
    - 新建据点：插入 `/据点/{据点名}`。
    - 建设设施：插入或替换 `/据点/{据点名}/设施/{设施标识}`。
    - 分配成员：替换设施的 `工作成员`，必要时移动成员位置。
    - 消耗/获得资源：更新 `/据点/{据点名}/仓库/物品` 或 `/据点/{据点名}/资金`。
    - 事件出现/解决：插入、替换或移除 `/据点/{据点名}/到来事件/{事件标题}`。
    - 据点升级：替换 `/据点/{据点名}/等级`。

    ## 12. 风格要求
    据点叙事应具有 Kenshi 废土感：贫瘠、粗粝、功利、危险、带有荒诞的生存幽默。
    不要把据点写成安全后花园。哪怕经营顺利，也应保留饥饿、税收、风沙、酸雨、奴隶制、怪物、派系政治和人心问题。
