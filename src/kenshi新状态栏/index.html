        function getCharacterBasePath(mvuData, entityType, entityName, squadName = '') {
          const statData = _.get(mvuData, 'stat_data', {});
          const mainSquadName = getMainSquadName(statData);
          const squads = _.get(statData, '小队成员', {});
          const findMemberPathInAllSquads = targetName => {
            const normalizedTarget = String(targetName || '').trim();
            if (!normalizedTarget) return null;
            for (const [sqName, sqData] of Object.entries(squads || {})) {
              const members = _.get(sqData, '成员', {});
              const hitKey = Object.keys(members || {}).find(k => String(k).trim() === normalizedTarget);
              if (hitKey) return ['stat_data', '小队成员', sqName, '成员', hitKey];
            }
            return null;
          };
          if (entityType === 'current') {
            const mainControllerName = String(getMainControllerName(statData) || '').trim();
            if (mainControllerName) {
              return ['stat_data', '小队成员', mainSquadName, '成员', mainControllerName];
            }
            const fallbackMemberName = Object.keys(_.get(statData, ['小队成员', mainSquadName, '成员'], {}))[0];
            if (fallbackMemberName) {
              return ['stat_data', '小队成员', mainSquadName, '成员', fallbackMemberName];
            }
            return findMemberPathInAllSquads(entityName);
          }
          if (entityType === 'squad') {
            const targetSquadName = String(squadName || '').trim() || mainSquadName;
            const members = _.get(statData, ['小队成员', targetSquadName, '成员'], {});
            const hitKey = Object.keys(members || {}).find(k => String(k).trim() === String(entityName || '').trim());
            if (hitKey) {
              return ['stat_data', '小队成员', targetSquadName, '成员', hitKey];
            }
            return findMemberPathInAllSquads(entityName);
          }
          return null;
        }

        async function unequipWeapon(slot) {
          if (!currentModalEntity) return;
          const { entityType, entityName, squadName } = currentModalEntity;
          if (entityType !== 'current' && entityType !== 'squad') return;
          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          const basePath = getCharacterBasePath(mvuData, entityType, entityName, squadName);
          if (!basePath) return;
          const weaponKey = slot === 'sub' ? '副武器' : '主武器';
          const weapon = _.cloneDeep(_.get(mvuData, [...basePath, weaponKey], {}));
          const weaponName = String(_.get(weapon, '名字', '')).trim();
          const weaponType = String(_.get(weapon, '种类', '')).trim();
          if (!weaponName) return;
          if (['武术', '无'].includes(weaponName) || ['武术类', '空手', '无'].includes(weaponType)) return;
          const bagPath = [...basePath, '背包', '物品'];
          const bagItems = _.get(mvuData, bagPath, {});
          const existedKey =
            Object.keys(bagItems || {}).find(k => String(k).trim() === String(weaponName).trim()) || weaponName;
          const existed = _.get(bagItems, existedKey, null);
          if (existed && typeof existed === 'object') {
            _.set(mvuData, [...bagPath, existedKey, '数量'], Number(_.get(existed, '数量', 1)) + 1);
          } else {
            _.set(mvuData, [...bagPath, weaponName], {
              ...weapon,
              分类: '武器',
              数量: 1,
              重量: Number(_.get(weapon, '重量', 1)) || 1,
            });
          }
          if (weaponKey === '主武器') {
            _.set(mvuData, [...basePath, weaponKey], buildMartialArtsWeapon(_.get(mvuData, basePath, {})));
          } else {
            _.unset(mvuData, [...basePath, weaponKey]);
          }
          await Mvu.replaceMvuData(mvuData, option);
          update();
          const latest = _.get(mvuData, basePath, {});
          $('#modal-content-inner').html(buildCharHTML(latest, entityType === 'current', entityType, entityName));
        }

        async function equipWeaponFromBag(itemName, slot) {
          if (!currentModalEntity) return;
          const { entityType, entityName, squadName } = currentModalEntity;
          if (entityType !== 'current' && entityType !== 'squad') return;
          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          const basePath = getCharacterBasePath(mvuData, entityType, entityName, squadName);
          if (!basePath) return;
          const bagPath = [...basePath, '背包', '物品'];
          const normalizedItemName = String(itemName || '').trim();
          if (!normalizedItemName || ['武术', '无'].includes(normalizedItemName)) return;
          const bagItems = _.get(mvuData, bagPath, {});
          const fallbackKey =
            Object.keys(bagItems || {}).find(k => String(k).trim() === normalizedItemName) || normalizedItemName;
          const bagItem = _.cloneDeep(_.get(mvuData, [...bagPath, fallbackKey], null));
          if (!bagItem || _.get(bagItem, '分类') !== '武器') return;
          const bagItemType = String(_.get(bagItem, '种类', '') || '').trim();
          if (['空手', '无'].includes(bagItemType)) return;

          const weaponKey = slot === 'sub' ? '副武器' : '主武器';
          const currentEquipped = _.cloneDeep(_.get(mvuData, [...basePath, weaponKey], {}));
          const currentEquippedName = String(_.get(currentEquipped, '名字', '')).trim();
          const currentEquippedType = String(_.get(currentEquipped, '种类', '')).trim();
          const isVirtualEmptyWeapon =
            !currentEquippedName ||
            ['无', '武术'].includes(currentEquippedName) ||
            ['无', '武术类', '空手'].includes(currentEquippedType);
          if (!isVirtualEmptyWeapon) {
            const existed = _.get(mvuData, [...bagPath, currentEquippedName], null);
            if (existed && typeof existed === 'object') {
              _.set(mvuData, [...bagPath, currentEquippedName, '数量'], Number(_.get(existed, '数量', 1)) + 1);
            } else {
              _.set(mvuData, [...bagPath, currentEquippedName], {
                ...currentEquipped,
                分类: '武器',
                数量: 1,
                重量: Number(_.get(currentEquipped, '重量', 1)) || 1,
              });
            }
          }

          const nextQty = Number(_.get(bagItem, '数量', 1)) - 1;
          if (nextQty > 0) _.set(mvuData, [...bagPath, fallbackKey, '数量'], nextQty);
          else _.unset(mvuData, [...bagPath, fallbackKey]);

          _.set(mvuData, [...basePath, weaponKey], {
            名字: _.get(bagItem, '名字', normalizedItemName),
            种类: _.get(bagItem, '种类', '无'),
            品质: _.get(bagItem, '品质', '普通'),
            介绍: _.get(bagItem, '介绍', ''),
            伤害骰: _.get(bagItem, '伤害骰', '1d4'),
            伤害类型: _.get(bagItem, '伤害类型', '钝伤:1.0'),
            价值: Number(_.get(bagItem, '价值', 0)) || 0,
            重量: Number(_.get(bagItem, '重量', 1)) || 1,
          });

          await Mvu.replaceMvuData(mvuData, option);
          update();
          const latest = _.get(mvuData, basePath, {});
          $('#modal-content-inner').html(buildCharHTML(latest, entityType === 'current', entityType, entityName));
        }

        async function deleteSquad(squadName) {
          if (!squadName) return;
          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          const squadData = _.get(mvuData, 'stat_data.小队成员', {});
          const squad = _.get(squadData, squadName);
          if (!squadData || !squad) return;
          const memberCount = Object.keys(_.get(squad, '成员', {})).length;
          if (memberCount > 0) return;
          const nextSquadData = _.omit(squadData, [squadName]);
          _.set(mvuData, 'stat_data.小队成员', nextSquadData);
          await Mvu.replaceMvuData(mvuData, option);
          const settings = loadSettings();
          if (settings[SETTINGS_KEYS.MAIN_SQUAD] === squadName) {
            settings[SETTINGS_KEYS.MAIN_SQUAD] = Object.keys(nextSquadData)[0] || '';
            settings[SETTINGS_KEYS.MAIN_CONTROLLER] = '';
            saveSettings(settings);
          }

        }

        async function mergeSquad(sourceSquadName, targetSquadName) {
          if (!sourceSquadName || !targetSquadName || sourceSquadName === targetSquadName) return;
          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          const rawVars = getAllVariables();
          const statData = _.get(rawVars, 'stat_data', {});
          const mainControllerName = getMainControllerName(statData) || '主控';
          const sourceSquad = _.get(mvuData, ['stat_data', '小队成员', sourceSquadName], {});
          const targetSquad = _.get(mvuData, ['stat_data', '小队成员', targetSquadName], {});
          const mergedMembers = { ..._.get(targetSquad, '成员', {}), ..._.get(sourceSquad, '成员', {}) };
          const mergedView = { ..._.get(targetSquad, '视野', {}), ..._.get(sourceSquad, '视野', {}) };
          _.set(mvuData, ['stat_data', '小队成员', targetSquadName, '成员'], mergedMembers);
          _.set(mvuData, ['stat_data', '小队成员', targetSquadName, '视野'], mergedView);
          _.set(
            mvuData,
            ['stat_data', '小队成员', targetSquadName, '金钱'],
            Number(_.get(targetSquad, '金钱', 0)) + Number(_.get(sourceSquad, '金钱', 0)),
          );
          _.set(mvuData, 'stat_data.小队成员', _.omit(_.get(mvuData, 'stat_data.小队成员', {}), [sourceSquadName]));
          const mergedMemberNames = Object.keys(mergedMembers);
          const mergedMemberText = mergedMemberNames.length ? mergedMemberNames.join('，') : '暂无成员';
          await Mvu.replaceMvuData(mvuData, option);
          appendTextToPlayerInput(
            `${mainControllerName}决定将小队【${sourceSquadName}】并入小队【${targetSquadName}】，成员是${mergedMemberText}`,
          );
          update();
        }

        $(document).on('click', '.stat-item.stat-clickable', async function () {
          const attrKey = $(this).attr('data-attr');
          const entityType = $(this).attr('data-entity');
          const entityName = $(this).attr('data-name');
          if (!attrKey || !entityType) return;

          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          if (!_.get(mvuData, 'stat_data')) {
            const rawVars = getAllVariables();
            const fallbackData = _.get(rawVars, 'stat_data', {});
            if (!_.isEmpty(fallbackData)) {
              _.set(mvuData, 'stat_data', fallbackData);
            }
          }

          let basePath = [];
          const statData = _.get(mvuData, 'stat_data', {});
          const mainSquadName = getMainSquadName(statData);
          if (entityType === 'current') {
            basePath = ['stat_data', '小队成员', mainSquadName, '成员', getMainControllerName(statData)];
          } else if (entityType === 'squad' && entityName) {
            // 使用数组路径避免成员名中包含 "."、"["、"]" 等字符时被 lodash 误解析
            basePath = ['stat_data', '小队成员', mainSquadName, '成员', entityName];
          } else {
            return;
          }

          const attrPointPath = [...basePath, '属性点'];
          const attrPath = [...basePath, '属性', attrKey];
          const attrPoint = Number(_.get(mvuData, attrPointPath, 0));
          if (attrPoint <= 0) return;

          const currentValue = _.get(mvuData, attrPath);
          let nextValue = currentValue;
          if (typeof currentValue === 'object' && currentValue !== null) {
            const base = Number(_.get(currentValue, '基础', 0));
            const bonus = Number(_.get(currentValue, '加成', 0));
            nextValue = { ...currentValue, 基础: base + 1, 加成: bonus };
          } else {
            const base = Number(currentValue ?? 0) || 0;
            nextValue = { 基础: base + 1, 加成: 0 };
          }

          _.set(mvuData, attrPath, nextValue);
          _.set(mvuData, attrPointPath, attrPoint - 1);
          await Mvu.replaceMvuData(mvuData, option);
          update();

          if (entityType === 'squad' && entityName) {
            const latestRaw = getAllVariables();
            const latestMember = _.get(latestRaw, ['stat_data', '小队成员', entityName], _.get(mvuData, basePath));
            $('#modal-content-inner').html(buildCharHTML(latestMember, false, 'squad', entityName));

        function resolveEntityData(data, entityType, entityName) {
          if (entityType === 'current') return getMainControllerData(data);
          if (entityType === 'squad' && entityName) return _.get(data, ['小队成员', entityName]);
          if (entityType === 'view' && entityName) {
            const mainSquad = getMainSquadData(data);
            return _.get(mainSquad, ['视野', entityName]);
          }
          if (entityType === 'other' && entityName) return _.get(data, ['异地', entityName]);
          return null;
        }

          const entityName = $(this).attr('data-name') || '';
          const raw = getAllVariables();
          const statData = _.get(raw, 'stat_data', {});
          const roleData = resolveEntityData(statData, entityType, entityName);

          const displayName = _.get(roleData, '名字') || (entityName && entityName !== '' ? entityName : '主控角色');

          $('#mood-history-role').text(displayName);

          const descriptions = [];
          const safeDescriptions = [];
          $('#mood-history-count').text(0);

          const list = $('#mood-history-list').empty();
          if (!roleData || typeof roleData !== 'object' || roleData === '待初始化') {
            list.html('<div class="mood-history-empty">该角色数据待初始化，暂无记录。</div>');
          } else if (safeDescriptions.length === 0) {
            list.html('<div class="mood-history-empty">当前结构已移除心情记录。</div>');

            safeDescriptions.forEach((line, idx) => {
              list.append(`<li><span style="color:#8ecfff">#${idx + 1}</span> ${_.escape(String(line))}</li>`);

        $(document).on('click', '.stance-option', async function (e) {
          e.preventDefault();

          if (!stance || !currentModalEntity) return;
          if (
            (currentModalEntity.entityType !== 'view' && currentModalEntity.entityType !== 'other') ||
            !currentModalEntity.entityName

            return;

          const option = { type: 'message', message_id: getCurrentMessageId() };
          const mvuData = Mvu.getMvuData(option) || {};
          if (!_.get(mvuData, 'stat_data')) {
            const rawVars = getAllVariables();
            const fallbackData = _.get(rawVars, 'stat_data', {});
            if (!_.isEmpty(fallbackData)) {
              _.set(mvuData, 'stat_data', fallbackData);
            }
          }

          const statData = _.get(mvuData, 'stat_data', {});
          const mainSquadName = getMainSquadName(statData);
          const basePath =
            currentModalEntity.entityType === 'other'
              ? ['stat_data', '异地', currentModalEntity.entityName]
              : ['stat_data', '小队成员', mainSquadName, '视野', currentModalEntity.entityName];
          _.set(mvuData, [...basePath, '立场'], stance);
          await Mvu.replaceMvuData(mvuData, option);

          closeStancePopover();
          update();
          const sourceData =
            currentModalEntity.entityType === 'other'
              ? _.get(mvuData, 'stat_data.异地', {})
              : _.get(mvuData, ['stat_data', '小队成员', mainSquadName, '视野'], {});
          const latest = _.get(sourceData, currentModalEntity.entityName, {});

            buildCharHTML(latest, false, currentModalEntity.entityType, currentModalEntity.entityName),
          );
          // 实时更新move按钮显示
          const moveBtn = document.getElementById('move-squad-btn');
          const moveToViewBtn = document.getElementById('move-to-view-btn');
          if (
            moveBtn &&
            currentModalEntity &&
            (currentModalEntity.entityType === 'view' || currentModalEntity.entityType === 'other')
          ) {
            const newStance = _.get(latest, '立场', '');
            if (newStance === '友方') {
              moveBtn.style.display = 'flex';
              moveBtn.textContent = currentModalEntity.entityType === 'other' ? '入队' : '进队';
            } else {
              moveBtn.style.display = 'none';
            }
          }
          if (moveToViewBtn) {
            moveToViewBtn.style.display = currentModalEntity?.entityType === 'other' ? 'flex' : 'none';
          }
        });

        $(document).on('click', function (e) {
          if ($(e.target).closest('#stance-popover').length === 0 && $(e.target).closest('#stance-gear').length === 0) {
            closeStancePopover();
          }
        });

        const tip = $('#tooltip');
        let tipPinned = false;
        let tipOwner = null;

        function showTip(text, x, y) {
          if (!text) return;
          tip.text(text).show();
          const gap = 12;
          const tipWidth = tip.outerWidth();
          const tipHeight = tip.outerHeight();
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;

          let t = y + 15;
          let l = x + 15;

          if (l + tipWidth > viewportWidth - gap) l = viewportWidth - tipWidth - gap;
          if (t + tipHeight > viewportHeight - gap) t = y - tipHeight - 10;
          if (l < gap) l = gap;
          if (t < gap) t = gap;

          tip.css({ top: t, left: l });
        }

        function hideTip() {
          tip.hide();
        }

        $(document)
          .on('mouseenter', '.has-tooltip', function (e) {
            if (tipPinned) return;
            const text = $(this).attr('data-tooltip');
            showTip(text, e.clientX, e.clientY);
          })
          .on('mouseleave', '.has-tooltip', function () {
            if (tipPinned) return;
            hideTip();
          })
          .on('mousemove', function (e) {
            if (tip.css('display') !== 'none' && !tipPinned) {
              showTip(tip.text(), e.clientX, e.clientY);
            }
          })
          .on('click', '.has-tooltip', function (e) {
            const text = $(this).attr('data-tooltip');
            if (!text) return;

            if (tipPinned && tipOwner === this) {
              tipPinned = false;
              tipOwner = null;
              hideTip();
              return;
            }

            tipPinned = true;
            tipOwner = this;
            showTip(text, e.clientX, e.clientY);
          })
          .on('click', function (e) {
            if ($(e.target).closest('.has-tooltip').length === 0) {
              tipPinned = false;
              tipOwner = null;
              hideTip();
            }
          });
      }
      $(errorCatched(init));
    </script>

            </div>
          </div>
          <div id="pane-mission" class="tab-pane"><div id="mission-list"></div></div>
          <div id="pane-past" class="tab-pane">
            <div class="section-title">往事</div>
            <div class="past-controls">
              <select id="past-category-input" class="past-input">
                <option value="交友记录">交友记录</option>
                <option value="城镇记录">城镇记录</option>
                <option value="城镇纪略">城镇纪略</option>
                <option value="关键记忆">关键记忆</option>
              </select>
              <input id="past-date-input" class="past-input" type="number" placeholder="天数(默认当前天数)" />
              <textarea id="past-desc-input" class="past-textarea" placeholder="描述"></textarea>
              <button id="past-add-btn" class="past-add-btn">添加</button>
            </div>
            <div id="past-list"></div>
          </div>
          <div id="pane-stronghold" class="tab-pane">
            <div class="section-title">据点</div>
            <div id="stronghold-list"></div>
          </div>
          <div id="pane-map" class="tab-pane">
            <div class="section-title">
              地图 <button id="settings-btn" class="settings-btn" title="状态栏设置">⚙ 设置</button>
            </div>
            <div class="map-frame-wrap">
              <div id="map-root"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="char-modal" class="modal-overlay">
      <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <button id="enslave-btn" class="enslave-btn" style="display: none">贬为奴隶</button>
        <button id="move-to-view-btn" class="modal-view-btn" onclick="handleModalMoveToViewBtn()">进入视野</button>
        <button id="move-squad-btn" class="modal-move-btn" onclick="handleModalMoveBtn()">离队</button>
        <button id="stance-gear" class="stance-gear-btn" onclick="toggleStancePopover()">⚙</button>
        <div id="stance-popover" class="stance-popover">
          <div class="stance-popover-title">修改立场</div>
          <button class="stance-option enemy" data-stance="敌方">敌方</button>
          <button class="stance-option neutral" data-stance="中立">中立</button>
          <button class="stance-option friendly" data-stance="友方">友方</button>
        </div>
        <div id="modal-content-inner"></div>
      </div>
    </div>
    <div id="mood-history-modal" class="modal-overlay">
      <div class="mood-history-modal">
        <button class="mood-history-close" onclick="closeMoodHistoryModal()">×</button>
        <div class="mood-history-title">心情变化记录</div>
        <div class="mood-history-subtitle">
          <span id="mood-history-role">当前角色</span> · 共 <span id="mood-history-count">0</span> 条
        </div>
        <ol id="mood-history-list" class="mood-history-list"></ol>
      </div>
    </div>
    <div id="confirm-modal" class="modal-overlay">
      <div class="confirm-modal">
        <div class="confirm-title">确认删除</div>
        <div>是否删除该往事记录？</div>
        <input id="confirm-input" class="confirm-input" type="text" style="display: none" />
        <select id="confirm-select" class="confirm-select" style="display: none"></select>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="confirm-btn">取消</button>
          <button id="confirm-ok" class="confirm-btn danger">删除</button>
          <button id="confirm-third" class="confirm-btn" style="display: none"></button>
        </div>
      </div>
    </div>
    <div id="settings-modal" class="modal-overlay">
      <div class="modal-content settings-content">
        <button class="close-btn" onclick="closeSettingsModal()">×</button>
        <div class="section-title">状态栏设置</div>
        <div class="setting-item">
          <label for="setting-identity-edit">显示身份编辑按钮（小铅笔）</label>
          <input type="checkbox" id="setting-identity-edit" />
        </div>
        <div class="setting-item">
          <label for="setting-stance-gear">显示立场修改按钮（齿轮）</label>
          <input type="checkbox" id="setting-stance-gear" />
        </div>
        <button id="save-settings-btn" class="past-add-btn">保存</button>
      </div>
    </div>
    <div id="tooltip"></div>
  </body>
</html>
