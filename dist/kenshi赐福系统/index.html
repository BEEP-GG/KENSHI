x)(E,{className:'w-8 h-8 text-red-400'}),stats:[{name:'敏捷',value:9},{name:'感知',value:-5}]},{id:'kral_6',title:'决斗之誓',description:'荣誉就是光明正大的对决。你摒弃了所有阴险的潜行与偷袭，永远只从正面宣告死斗的到来。你的力量如破竹之势，但隐秘行动对你而言彻底成为不可能。',rarity:'史诗',icon:(0,i.jsx)(f,{className:'w-8 h-8 text-red-400'}),stats:[{name:'力量',value:15},{name:'敏捷',value:-12}]},{id:'kral_7',title:'破釜的狂吼',description:'逃兵是克拉尔信徒最大的耻辱。你截断了自己一切逃跑的念头，即使面对深渊也能爆发出不可撼动的狂热韧性，但也由于永不退缩而丧失了机动拉扯的能力。',rarity:'传说',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-red-500'}),stats:[{name:'韧性',value:34},{name:'敏捷',value:-18}]},{id:'kral_8',title:'无畏迎击',description:'任何躲藏与掩护都是对荣誉的亵渎。你本能地用胸膛迎向敌人的利刃，这种不要命的刚猛让你体魄强横，却也彻底放弃了所有闪避防守的技巧。',rarity:'稀有',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-orange-400'}),stats:[{name:'体质',value:12},{name:'敏捷',value:-10}]},{id:'kral_9',title:'傲立重击',description:'以最为蛮横无脑的硬碰硬武艺。用万钧之势正面劈下，凭借纯粹的力量强行剥夺对手所有的招架空间。',rarity:'普通',icon:(0,i.jsx)(f,{className:'w-8 h-8 text-red-400'}),stats:[{name:'力量',value:8}]},{id:'kral_10',title:'不退者',description:'誓死不退的磐石招架。双足重重踩入地表，以不退、不避、不偏的绝对钢骨顶着对手的武器正面反震。',rarity:'普通',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-red-300'}),stats:[{name:'体质',value:8}]},{id:'kral_11',title:'角斗士的狂澜舞',description:'在毫无保留的正面比武死斗中汲取战意。刀锋化为连绵不断的恐怖重劈，强硬格挡敌方武器的同时，以无可阻挡的攻势将其压制致死。',rarity:'史诗',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-orange-400'}),stats:[{name:'力量',value:6},{name:'体质',value:6}]},{id:'kral_12',title:'无上王座',description:'将克拉尔的荣耀与战意推至极巅。正面完美碰碎格开敌方兵刃的同时震彻全身筋骨，瞬间劈出一记仿佛足以斩开山河与生灵的王者重斩。',rarity:'传说',icon:(0,i.jsx)(f,{className:'w-8 h-8 text-red-600'}),stats:[{name:'力量',value:25},{name:'韧性',value:-8}]},{id:'kral_13',title:'孤狼浴血',description:'继承了克拉尔率领数人殿后面对数万大军的孤高死战韧性。敌人越多你反而越不怕，越能在战斗中厮杀敌军，你的痛觉会完全被昂扬战意阻断，然而，这种孤僻的自负也令你脾气暴烈排外。',rarity:'史诗',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-red-500'}),stats:[{name:'体质',value:6},{name:'韧性',value:12},{name:'魅力',value:-14}]},{id:'kral_14',title:'裂骨踏步',description:'你学会了以沉重踏步逼近对手，哪怕脚下尽是碎骨与血泥，也绝不让气势有半分后退。',rarity:'普通',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-red-300'}),stats:[{name:'力量',value:4},{name:'体质',value:2}]},{id:'kral_15',title:'战吼聚血',description:'短促而凶狠的战吼能让你的血更快热起来。吼声未必吓得住敌人，却足以让你自己先凶上三分。',rarity:'普通',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-orange-300'}),stats:[{name:'韧性',value:3},{name:'力量',value:3}]},{id:'kral_16',title:'王血战契',description:'将克拉尔的战契刻入骨髓。奖励：自此获得承载克拉尔传说赐福的资格。代价：你的荣耀会被钉死在正面厮杀的王道上，未来将难以再被奥克兰、娜尔可与比拉克真正接纳。此项不消耗特质点，请在赐予角色时再次确认。',traitDescription:'克拉尔的王血战契已刻入骨髓。你的荣耀被绑定在正面对决的王道之上，自此获得承载克拉尔传说赐福的资格。',displayRarity:'传说（解锁前置）',rarity:'传说',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-red-500'}),stats:[{name:'力量',value:8}]}]},{id:'narko',name:'娜尔可',title:'黑暗之神',description:'潜藏于阴影中的魔神，赐予那些敢于直面深渊之人狡诈与幻化。',fullDescription:'光明太过刺眼，它掩盖了谎言。投入黑夜的怀抱吧，娜尔可将教导你如何在敌人的影子里起舞，或者在无声中诡异地活下去。',colorFrom:'from-purple-950',colorTo:'to-indigo-500',borderGlow:'hover:border-indigo-500',bgGlow:'bg-purple-950/30',icon:(0,i.jsx)(S,{className:'w-12 h-12 text-indigo-400'}),blessings:[{id:'narko_1',title:'虚空潜行',description:'在阴影中完全隐身，如同鬼魅一般收割生命。',rarity:'传说',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-indigo-300'}),stats:[{name:'敏捷',value:20}]},{id:'narko_2',title:'梦魇化身',description:'你的存在本身就是一种恐惧，直视你双眼的生物会感到一种刺骨的阴森。不过，连你的盟友也会由于生理不适对你敬而远之。',rarity:'史诗',icon:(0,i.jsx)(S,{className:'w-8 h-8 text-purple-400'}),stats:[{name:'感知',value:12},{name:'魅力',value:-12}]},{id:'narko_3',title:'原罪诱惑',description:'你散发着迷人又危险的深渊气息，能轻易蛊惑韧性薄弱的敌人听命于你，但也会引起狂热者的欲望，对你进行过度占有，占有你的一切。',rarity:'稀有',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-violet-300'}),stats:[{name:'魅力',value:12},{name:'韧性',value:-8}]},{id:'narko_4',title:'暗夜收割者',description:'在黑夜中杀戮能为你提供源源不断的精力，你的动作会变得异常敏捷，但当黎明降临时你会变得虚弱无力。',rarity:'史诗',icon:(0,i.jsx)(D,{className:'w-8 h-8 text-indigo-200'}),stats:[{name:'敏捷',value:12},{name:'体质',value:-8}]},{id:'narko_5',title:'毒刃之吻',description:'你所持有的武器都将获得毒液。',rarity:'稀有',icon:(0,i.jsx)(f,{className:'w-8 h-8 text-purple-500'}),stats:[{name:'敏捷',value:4}]},{id:'narko_6',title:'阴影重塑',description:'当你处于阴影中时，你的伤口会以肉眼可见的速度愈合，代价是哪怕一点点阳光也会灼伤你的皮肤。',rarity:'史诗',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-violet-400'}),stats:[{name:'体质',value:8},{name:'力量',value:-8}]},{id:'narko_7',title:'梦魇狂呓',description:'如果敌人惧怕你，就能够使敌人在梦中感受到你的恐惧，让其陷入噩梦循环，痛不欲生。作为代偿，你自己的眼睑也将被缝入无边的黑夜，无法再忍受哪怕一丝的烈目直视。',rarity:'传说',icon:(0,i.jsx)(P,{className:'w-8 h-8 text-fuchsia-400'}),stats:[{name:'魅力',value:24},{name:'韧性',value:-15}]},{id:'narko_8',title:'暗巷毒蛇',description:'你长期游走在阴影与夹缝之间，熟悉如何借地形、视线与小手段为自己争出优势。那些不够体面的求生经验令你行动更轻更快，也让你的体魄在日积月累的消耗中显得单薄。',rarity:'普通',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-purple-500'}),stats:[{name:'敏捷',value:4},{name:'感知',value:3},{name:'体质',value:-3}]},{id:'narko_9',title:'落影佯退步',description:'极具欺骗性的娜尔可流步法。在兵刃相碰时总是做出一副气力不支倒退数步的狼狈滑步，诱骗对手乘胜追击，实则蓄势待发，抓住破绽一招制敌。',rarity:'传说',icon:(0,i.jsx)(D,{className:'w-8 h-8 text-indigo-400'}),stats:[{name:'敏捷',value:18},{name:'感知',value:8}]},{id:'narko_10',title:'恶念算尽',description:'娜尔可赐予你不择手段的阴狠计谋。你会本能地绕开正面对拼，转而优先撕扯敌人的软肋、顾虑与最脆弱之处，以此来使对方漏出破绽会被迫臣服。',rarity:'史诗',icon:(0,i.jsx)(f,{className:'w-8 h-8 text-violet-400'}),stats:[{name:'感知',value:7},{name:'敏捷',value:3}]},{id:'narko_11',title:'毒心穿隙',description:'你练就了极其阴狠刁钻的近身杀法。混战与纠缠之中，你总能捕捉护甲、骨架与动作衔接间最细微的空隙，把淬毒的狠手精准送进足以瓦解敌势的要害节点。',rarity:'史诗',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-purple-400'}),stats:[{name:'敏捷',value:7},{name:'感知',value:3}]},{id:'narko_16',title:'影下藏针',description:'你习惯在交锋前悄悄布置那些不起眼的小动作：换位、遮挡、藏械、借物。它们未必足以决定胜负，却总能让你比对手更早一步摸到有利的位置。',rarity:'普通',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-violet-300'}),stats:[{name:'感知',value:2},{name:'敏捷',value:2}]},{id:'narko_12',title:'魅影流沙',description:'赐予你能够在战斗中无形散播令人精神恍惚的迷雾幻影，令当面的敌手混淆真实与幻象。虚虚实实让人完全无法捉摸踪迹。完美招架敌刃的同时进行最狠辣阴毒的反噬一击。',rarity:'传说',icon:(0,i.jsx)(S,{className:'w-8 h-8 text-indigo-300'}),stats:[{name:'敏捷',value:18},{name:'感知',value:8}]},{id:'narko_13',title:'影隙贴步',description:'你习惯在阴影边缘挪步借位，让自己的轮廓总比别人预想中更淡一拍，仿佛总差半寸才会被抓住。',rarity:'普通',icon:(0,i.jsx)(D,{className:'w-8 h-8 text-violet-300'}),stats:[{name:'敏捷',value:3},{name:'感知',value:2}]},{id:'narko_14',title:'夜瞳余辉',description:'在昏暗环境里待得太久，你的眼睛已经学会追逐微弱反光。黑夜未必属于你，但你比常人更不怕它。',rarity:'普通',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-indigo-300'}),stats:[{name:'感知',value:5},{name:'韧性',value:1}]},{id:'narko_15',title:'暗夜圣痕',description:'让娜尔可的暗夜圣痕覆盖你的影子。奖励：自此获得承载娜尔可传说赐福的资格。代价：你的灵魂会逐渐与黑夜同流，未来将难以再被奥克兰、克拉尔与比拉克真正接纳。此项不消耗特质点，请在赐予角色时再次确认。',traitDescription:'娜尔可的暗夜圣痕已覆盖你的影子。你的灵魂被黑夜接纳，自此获得承载娜尔可传说赐福的资格。',displayRarity:'传说（解锁前置）',rarity:'传说',icon:(0,i.jsx)(S,{className:'w-8 h-8 text-indigo-300'}),stats:[{name:'敏捷',value:8}]}]},{id:'chitrin',name:'奇特林',title:'顶级骨人工匠',description:'游荡于旧帝国废墟中的顶级骨人工匠，掌握着被遗忘的机械技艺与生存智慧。',fullDescription:'血肉苦弱，唯有匠艺与钢铁更接近永存。奇特林并非神明，而是旧帝国工艺残响中的顶级骨人工匠。他将指引你发掘遗构、修补残骸、重铸装备，并以最冷静务实的方式在废土上活下去。',colorFrom:'from-emerald-950',colorTo:'to-teal-400',borderGlow:'hover:border-teal-400',bgGlow:'bg-emerald-950/30',icon:(0,i.jsx)(T,{className:'w-12 h-12 text-teal-400'}),blessings:[{id:'chitrin_1',title:'维基百科云玩家',description:'你脑子里装着整个世界的科技蓝图和秘密，但长期脱离体力劳动让你变得手无缚鸡之力。',rarity:'传说',icon:(0,i.jsx)(N,{className:'w-8 h-8 text-teal-300'}),stats:[{name:'智力',value:30},{name:'力量',value:-12},{name:'韧性',value:-12}]},{id:'chitrin_3',title:'废土机械师',description:'你深谙废土上最实用的生存本领：拆、修、拼、补。无论是残破义体、旧发电机还是快散架的武器护甲，你都能从垃圾堆里榨出继续活下去的价值，只是长期与铁片和零件为伴，让你比起人情世故更信任扳手与焊枪。',rarity:'稀有',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-emerald-400'}),stats:[{name:'智力',value:10},{name:'感知',value:5},{name:'魅力',value:-8}]},{id:'chitrin_4',title:'废铁义体改造',description:'你丧心病狂地用生锈的骨人零件替换了自己完好的肢体，获得了不知疲倦的金属力量，但持续的排异反应总是让你痛不欲生。',rarity:'稀有',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-teal-200'}),stats:[{name:'力量',value:16},{name:'体质',value:-9}]},{id:'chitrin_5',title:'精工重甲师',description:'你懂得如何用旧帝国遗构与废土材料拼出真正经得起战场考验的重甲。你打造的护层更讲究受力分配、连接结构与关键部位防护，因此能让穿戴者在硬扛重击时依旧稳固可靠，但厚重装配终究会拖慢动作。',rarity:'史诗',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-emerald-300'}),stats:[{name:'体质',value:18},{name:'敏捷',value:-12}]},{id:'chitrin_6',title:'重心流线斜架',description:'一门寻常的持械斜挡架势。在兵刃相碰时稍微偏转一下刃面倒角，让迎面砸下的蛮力顺着倾斜方向滑离少许，免去了蛮力硬撞。',rarity:'普通',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-teal-300'}),stats:[{name:'智力',value:5}]},{id:'chitrin_7',title:'借力打力',description:'一招简单的借力反推。在双方兵仗胶着角力的一刹那，顺着对手发力不稳时的方向顺势推挡，使其重心微晃从而抢回些许周旋主动。',rarity:'普通',icon:(0,i.jsx)(E,{className:'w-8 h-8 text-emerald-300'}),stats:[{name:'力量',value:5}]},{id:'chitrin_8',title:'破招腕隙击',description:'精确定位对手出招变式时的发力死角并以巧劲击之，可以引导其中途换招不顺、被迫回防。',rarity:'史诗',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-teal-400'}),stats:[{name:'智力',value:8},{name:'敏捷',value:6}]},{id:'chitrin_9',title:'料敌机先',description:'通过洞悉对手微妙的战术趋向，在对方出招前的一瞬即做出了完美的拦截和闪避，达成料敌机先的神异妙用。',rarity:'传说',icon:(0,i.jsx)(N,{className:'w-8 h-8 text-emerald-200'}),stats:[{name:'智力',value:10},{name:'感知',value:5}]},{id:'chitrin_10',title:'蛛母芯片',description:'奇特林指引你在大脑中编译了旧帝国仿生机械蜘蛛的微缩蓝图。你可以用废弃铁片、骨人遗骸和劣质电池制作出一只听从你的小型军用铁蜘蛛，代价是你将失去了对温情、浪漫及凡人哀乐的感受。',rarity:'史诗',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-teal-400'}),stats:[{name:'智力',value:22},{name:'感知',value:-12}]},{id:'chitrin_11',title:'静电防卫',description:'你现在的身体周围带有轻微电流，在战斗中它可以静电触发使对方的投掷物发生微小扭转，使其偏离原先轨迹，靠近你的人会受到轻微电击但不致命，难以与你相拥。',rarity:'史诗',icon:(0,i.jsx)(E,{className:'w-8 h-8 text-emerald-300'}),stats:[{name:'敏捷',value:14},{name:'魅力',value:-10}]},{id:'chitrin_12',title:'精校备件',description:'你能在交锋间隙迅速校准关节与传动结构，让每一次动作都更精确顺滑。',rarity:'普通',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-emerald-300'}),stats:[{name:'智力',value:2},{name:'敏捷',value:3}]},{id:'chitrin_13',title:'扭矩校准',description:'你对发力角度和承重点有着特别的习惯。哪怕是最朴素的一次格挡，也会被你调整到更省力的位置。',rarity:'普通',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-teal-300'}),stats:[{name:'智力',value:3},{name:'力量',value:3}]},{id:'chitrin_15',title:'机魂接驳印',description:'让奇特林将旧帝国的机魂接驳印刻入你的神经与骨骼。奖励：自此获得承载奇特林传说赐福的资格。代价：你对情感、温情与他人心绪的理解会逐渐变得迟钝，未来将难以再被奥克兰、克拉尔、娜尔可与比拉克真正接纳。此项不消耗特质点，请在赐予角色时再次确认。',traitDescription:'奇特林的机魂接驳印已刻入你的神经与骨骼。你对情感与人心的理解开始淡薄，自此获得承载奇特林传说赐福的资格。',displayRarity:'传说（解锁前置）',rarity:'传说',icon:(0,i.jsx)(T,{className:'w-8 h-8 text-teal-300'}),stats:[{name:'智力',value:8}]}]},{id:'yuri',name:'比拉克',title:'恶魔亲王',description:'来自异世的扭曲恶魔，用理智与容貌换取血肉恩赐。',fullDescription:'不要直视它的全貌。比拉克是来自未知维度的深渊亲王，它乐于赐予凡人无可匹敌的绝对单项力量，前提是你愿意接受肢体的异化、感官的扭曲与灵魂的哀嚎。',colorFrom:'from-fuchsia-900',colorTo:'to-pink-600',borderGlow:'hover:border-pink-600',bgGlow:'bg-fuchsia-950/30',icon:(0,i.jsx)(M,{className:'w-12 h-12 text-pink-500'}),blessings:[{id:'yuri_1',title:'喙嘴猩猩之手',description:'双手异化成了如同喙嘴猩猩般臃肿粗壮的畸形巨爪。狂暴的肌肉纤维使你的抓握力强大，足以生生握碎精铁铠甲；但骨骼与关节结构的彻底异化变粗，精细度操作对你而言完全成了灾难。',rarity:'传说',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-pink-400'}),stats:[{name:'力量',value:18},{name:'敏捷',value:-8},{name:'魅力',value:-12}]},{id:'yuri_2',title:'骨犬之首',description:'你的头颅硬生生变异成了骨犬的模样，撕咬力惊人且获得了野兽感官，但你现在只能发出令人毛骨悚然的咆哮，并经常不受控制地流出恶臭口水。',rarity:'史诗',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-fuchsia-400'}),stats:[{name:'力量',value:18},{name:'智力',value:-8},{name:'魅力',value:-14}]},{id:'yuri_3',title:'喙嘴盲壳',description:'你的眼睛退化融合，面部和胸口长出了喙嘴兽般坚硬的肿胀角质层。你几乎免疫了头部的致命伤，但视野变得极其狭窄且外貌骇人。',rarity:'史诗',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-pink-300'}),stats:[{name:'体质',value:22},{name:'感知',value:-14},{name:'魅力',value:-14}]},{id:'yuri_4',title:'猩红触手增生',description:'每当受到重伤，你的伤口会爆发出令人作呕的肉色触手进行高速重组。这让你获得超速再生，但每次增生都会伴杂着精神剧痛，让你离人类越来越远。',rarity:'传说',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-fuchsia-500'}),stats:[{name:'体质',value:25},{name:'韧性',value:-14},{name:'魅力',value:-25}]},{id:'yuri_5',title:'寄生复眼丛聚',description:'你的脸颊和脖颈上长出了密密麻麻的深紫色寄生复眼，这赋予了你极其夸张的全方位动态视力，但也让所有看到你的人感到强烈的生理恶心。',rarity:'稀有',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-pink-200'}),stats:[{name:'感知',value:22},{name:'敏捷',value:8},{name:'魅力',value:-25}]},{id:'yuri_6',title:'乌龟身躯',description:'身躯变为沼泽乌龟的龟壳，你的胸与背被龟壳包围，获得沉重的龟壳重甲保护。但也因此行动缓慢。',rarity:'史诗',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-pink-500'}),stats:[{name:'体质',value:15},{name:'韧性',value:10},{name:'敏捷',value:-12}]},{id:'yuri_6b',title:'蛮荒恶兽',description:'比拉克将你朝着野兽化的完美猎杀形态推进。你的肌肉、骨架与咬合本能都在异变中变得更适合扑杀与撕裂，战斗时会爆发出近乎蛮荒凶兽般的压制力；代价则是日常姿态与面容都愈发偏离人形，渐渐的失去思考能力。',rarity:'传说',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-pink-500'}),stats:[{name:'力量',value:28},{name:'体质',value:24},{name:'韧性',value:24},{name:'魅力',value:-40},{name:'智力',value:-40}]},{id:'yuri_7',title:'骨骼倒生逆抓',description:'多关节倒生的扭曲逆手缠斗绝学。你的双肩与腕部可以任意脱臼，以非人的绝对诡异姿态死死绞住缠紧对方的武器。',rarity:'普通',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-pink-300'}),stats:[{name:'体质',value:5}]},{id:'yuri_8',title:'厚皮爆弹',description:'当厚厚的几层角质异变体表在受创受劈时瞬间隆起抗压，爆发出刺耳的血肉挤压撕裂声，以纯粹弹性力道反震将利刃弹开。',rarity:'普通',icon:(0,i.jsx)(j,{className:'w-8 h-8 text-fuchsia-300'}),stats:[{name:'体质',value:5}]},{id:'yuri_9',title:'裂吻狂噬',description:'以身体突兀裂开的骨刺大嘴或是狂狂生长的畸形副手，生生卡死劈来的长枪大剑。',rarity:'史诗',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-pink-400'}),stats:[{name:'力量',value:6},{name:'体质',value:4}]},{id:'yuri_10',title:'戮战刺椎',description:'比拉克赐予的畸变肉身斗技。当你架刀格挡时，体侧肋下突兀暴长出数根狰狞尖锐的角质硬刺，如闭合的巨兽之吻般死死夹咬住对方的长兵重击，并顺势进行毁灭性撕扯。',rarity:'传说',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-fuchsia-500'}),stats:[{name:'体质',value:10},{name:'力量',value:5}]},{id:'yuri_10b',title:'逆骨荆身',description:'比拉克让你的胸腹、肋侧与脊背埋入一层会在受压时暴起的逆生骨刺。敌人一旦贴身扑杀、抱缠或重击压上，这些尖骨便会自你体内爆突而出，顺着血肉与甲缝反扎入对方身体，像活着的反甲般在承伤的同时回敬残忍创口。',rarity:'史诗',icon:(0,i.jsx)(j,{className:'w-8 h-8 text-pink-400'}),stats:[{name:'体质',value:8},{name:'力量',value:4}]},{id:'yuri_11',title:'角质偏振',description:'异变角质会在受击前短促收缩并偏导冲击，缓和正面打击带来的创伤，让你在混战中更能硬抗一线。',rarity:'普通',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-pink-300'}),stats:[{name:'体质',value:3},{name:'敏捷',value:1}]},{id:'yuri_12',title:'副肢痉挛',description:'你的腋下与肋侧会在激战时短暂鼓起畸形肉芽，像是有什么副肢即将破体而出。它们尚未真正成形，却已足够干扰对手的判断并帮你在贴身缠斗中抢出半拍先机。',rarity:'普通',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-pink-300'}),stats:[{name:'敏捷',value:2},{name:'力量',value:1}]},{id:'yuri_13',title:'副肢破茧',description:'原本只会痉挛鼓起的畸形肉芽终于撕开皮肉，长成数根短促而暴躁的半成形副肢。它们还不足以独立挥击，却已能在贴身纠缠时替你撕、扯、架、绊，让你比先前更加危险。',rarity:'史诗',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-fuchsia-400'}),stats:[{name:'敏捷',value:5},{name:'力量',value:3},{name:'体质',value:2}]},{id:'yuri_14',title:'副肢暴君',description:'那些半成形副肢终于不再满足于贴身撕扯。它们彻底破体而出，沿着肋侧与背脊长成数根粗暴、神经质且充满恶意的畸变副臂。它们会在你格挡、抱缠与扑杀时同时发力，让你宛如一头多肢掠食的深渊怪物。',rarity:'传说',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-pink-500'}),stats:[{name:'力量',value:8},{name:'敏捷',value:6},{name:'体质',value:4},{name:'魅力',value:-10}]},{id:'yuri_15',title:'血蜘蛛共生体(幼体)',description:'血蜘蛛幼体蛰伏在你的脊椎深处，与神经相连，带来敏锐感知与日复一日的隐痛；它真正的力量，似乎还远未被发掘。',rarity:'普通',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-pink-300'}),stats:[{name:'感知',value:8},{name:'体质',value:-10},{name:'魅力',value:-10}]},{id:'yuri_16',title:'血蜘蛛共生体(成熟体)',description:'脊椎里的血蜘蛛幼体已经长成成熟体。部分鲜红的蜘蛛肢体从你的背部刺出，力量在骨骼与肌肉间涌动；痛苦正在减轻，但它真正的潜能，似乎仍未完全苏醒。',rarity:'史诗',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-fuchsia-400'}),stats:[{name:'力量',value:6},{name:'体质',value:6},{name:'魅力',value:-8}]},{id:'yuri_17',title:'血蜘蛛共生体(长者)',description:'寄生在你脊椎中的血蜘蛛已经完全成熟。鲜红而锋利的四个完整蜘蛛肢体从背后舒展开来，你不再感到痛苦，甚至能以本能驱使其他血蜘蛛；但随之而来的饥饿，也在啃噬你的理智。',rarity:'传说',icon:(0,i.jsx)(M,{className:'w-8 h-8 text-red-500'}),stats:[{name:'力量',value:10},{name:'敏捷',value:10},{name:'体质',value:10},{name:'智力',value:-12},{name:'魅力',value:-12}]},{id:'yuri_18',title:'渊胎契印',description:'让比拉克将渊胎契印缝入你的血肉。奖励：自此获得承载比拉克传说赐福的资格。代价：你的身躯会被深渊视作孕育畸变的温床，未来将难以再被奥克兰、克拉尔与娜尔可真正接纳。此项不消耗特质点，请在赐予角色时再次确认。',traitDescription:'比拉克的渊胎契印已缝入你的血肉。你的身躯被深渊认作温床，自此获得承载比拉克传说赐福的资格。',displayRarity:'传说（解锁前置）',rarity:'传说',icon:(0,i.jsx)(L,{className:'w-8 h-8 text-pink-400'}),stats:[{name:'体质',value:8}]}]},{id:'beep',name:'比普',title:'欢乐之神',description:'废土最强（自封）战士，带来打破第四面墙的离谱恩赐。',fullDescription:'比！比普是最强的！跟随比普的脚步，你将获得打破第四面墙的奇妙力量。别太把这个烂世界当回事，毕竟快乐才是废土生存的第一法则！',colorFrom:'from-lime-500',colorTo:'to-green-400',borderGlow:'hover:border-green-500',bgGlow:'bg-lime-950/30',icon:(0,i.jsx)(P,{className:'w-12 h-12 text-green-400'}),blessings:[{id:'beep_kral_2',title:'脑干缺失的狂战士',description:'你把所有时间都用来挥舞重武器，肌肉填满了本该属于大脑的空间，数数超过10个指头就会头痛。',rarity:'史诗',icon:(0,i.jsx)(j,{className:'w-8 h-8 text-red-400'}),stats:[{name:'力量',value:10},{name:'智力',value:-9}]},{id:'beep_chitrin_2',title:'机械飞升狂热症',description:'你坚信“血肉苦弱，机械飞升”，用钢铁韧性强迫自己无视痛苦，但也因此搞垮了脆弱的肉体。',rarity:'史诗',icon:(0,i.jsx)(F,{className:'w-8 h-8 text-teal-400'}),stats:[{name:'韧性',value:9},{name:'体质',value:-8}]},{id:'beep_chitrin_3',title:'AI寻路大师',description:'你总能找到地图的“最优解”，以诡异步伐高速移动，但这种非人感让你产生了严重的社交障碍。',rarity:'稀有',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-emerald-400'}),stats:[{name:'敏捷',value:9},{name:'魅力',value:-8}]},{id:'beep_1',title:'废土纸片忍者',description:'你的速度快如鬼魅，但骨头脆得像饼干，可能一阵风就能让你骨折。',rarity:'史诗',icon:(0,i.jsx)(D,{className:'w-8 h-8 text-green-300'}),stats:[{name:'敏捷',value:10},{name:'体质',value:-9}]},{id:'beep_2',title:'被害妄想症',description:'你总觉得废土的风声、脚步和沉默都藏着恶意，因此总能提前察觉细微异常；但长期紧绷的神经也让你难以真正放松承受压力。',rarity:'普通',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-lime-300'}),stats:[{name:'感知',value:6},{name:'韧性',value:-2}]},{id:'beep_25',title:'认知滤镜',description:'杀人对你而言不像夺走生命，更像是在敲碎玩偶、拆开糖果包装。你对暴力的认知被某种危险的滤镜扭曲了，因此下手更稳，却不太擅长进行复杂判断。',rarity:'普通',icon:(0,i.jsx)(x,{className:'w-8 h-8 text-lime-300'}),stats:[{name:'力量',value:5},{name:'智力',value:-3}]},{id:'beep_23',title:'幻听者',description:'你总能听到别人未曾出口的念头：恐惧、贪婪、犹豫或杀意都会像耳语一样钻进脑海。那究竟是真正的心声，还是你幻想出来的回音，无人能够证明；但你确实因此更敏锐，也更难维持清晰理智。',rarity:'史诗',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-lime-400'}),stats:[{name:'感知',value:10},{name:'智力',value:-6}]},{id:'beep_24',title:'废土洁癖症',description:'在这个世界上，你总是维持整洁：擦净刀柄、整理衣角、避开污水，甚至能把破布披出体面感。别人会被你的干净气质吸引，却也很难理解你为何把有限脑力耗在清洁仪式上。',rarity:'普通',icon:(0,i.jsx)(B,{className:'w-8 h-8 text-lime-300'}),stats:[{name:'魅力',value:8},{name:'智力',value:-6}]},{id:'beep_3',title:'虚荣谷的娇贵偶像',description:'你的容貌是这片废土上唯一的亮色，人见人爱，但身体也像温室花朵般脆弱，淋点酸雨就可能当场去世。',rarity:'史诗',icon:(0,i.jsx)(S,{className:'w-8 h-8 text-lime-200'}),stats:[{name:'魅力',value:9},{name:'体质',value:-10}]},{id:'beep_4',title:'蜂巢传销之王',description:'你的口才堪比最顶级的蜂巢族商人，能把沙子卖给沙匪，但自尊心像玻璃一样脆弱，一句重话就能让你崩溃。',rarity:'稀有',icon:(0,i.jsx)(k,{className:'w-8 h-8 text-green-500'}),stats:[{name:'魅力',value:10},{name:'韧性',value:-8}]},{id:'beep_5',title:'读档预知者',description:'你似乎能预见“读档”前的未来以避开危险，但也因此十分依赖“SL大法”，稍有不顺就想放弃。',rarity:'传说',icon:(0,i.jsx)(C,{className:'w-8 h-8 text-lime-400'}),stats:[{name:'感知',value:10},{name:'韧性',value:-10}]},{id:'beep_6',title:'迷之自信',description:'从比普那里领悟到的绝伦勇气。即使面对最强之敌，你也能坚信自己已然天下无敌并大模大样地宣告此言，这匪夷所思的狂妄气势会强行干涉对手理智，令对方满脸困惑并产生战术迟疑。',rarity:'传说',icon:(0,i.jsx)(P,{className:'w-8 h-8
