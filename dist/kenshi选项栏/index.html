selector.active .actor-arrow {\\n  transform: rotate(90deg);\\n}\\n\\n.actor-name {\\n  max-width: 120px;\\n  overflow: hidden;\\n  text-overflow: ellipsis;\\n  white-space: nowrap;\\n  font-size: 0.9rem;\\n  letter-spacing: 1px;\\n}\\n\\n.actor-selector-menu {\\n  position: absolute;\\n  top: 42px;\\n  left: 0;\\n  min-width: 150px;\\n  max-height: min(50vh, 280px);\\n  overflow-y: auto;\\n  padding: 8px 0;\\n  background: rgba(15, 14, 17, 0.95);\\n  border: 1px solid rgba(147, 197, 253, 0.35);\\n  border-radius: 8px;\\n  box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65);\\n  opacity: 0;\\n  pointer-events: none;\\n  transform: translateY(-10px) scale(0.96);\\n  transform-origin: top left;\\n  transition: all 0.22s ease;\\n}\\n\\n.actor-selector.active .actor-selector-menu {\\n  opacity: 1;\\n  pointer-events: auto;\\n  transform: translateY(0) scale(1);\\n}\\n\\n.actor-selector-item {\\n  width: 100%;\\n  padding: 9px 14px;\\n  background: transparent;\\n  border: none;\\n  color: var(--kenshi-sand);\\n  text-align: left;\\n  cursor: pointer;\\n  letter-spacing: 1px;\\n}\\n\\n.actor-selector-item:hover,\\n.actor-selector-item.selected {\\n  background: rgba(96, 165, 250, 0.16);\\n  color: #e0f2fe;\\n}\\n\\n.action-gear-btn {\\n  position: absolute;\\n  top: 10px;\\n  right: 14px;\\n  width: 36px;\\n  height: 36px;\\n  background: radial-gradient(circle at 30% 30%, #3a332e, #1a1514 70%);\\n  border: 1px solid rgba(198, 166, 100, 0.65);\\n  border-radius: 50%;\\n  display: flex;\\n  justify-content: center;\\n  align-items: center;\\n  color: #e5d1a4;\\n  cursor: pointer;\\n  box-shadow:\\n    0 6px 14px rgba(0, 0, 0, 0.55),\\n    inset 0 1px 2px rgba(255, 255, 255, 0.15),\\n    inset 0 -1px 2px rgba(0, 0, 0, 0.5);\\n  transition:\\n    transform 0.25s ease,\\n    box-shadow 0.25s ease,\\n    background 0.25s ease;\\n  z-index: 10;\\n}\\n\\n.action-gear-btn::before {\\n  content: \'\';\\n  position: absolute;\\n  inset: -6px;\\n  border-radius: 50%;\\n  border: 1px solid  0.08) 55%,\\n    rgba(198, 166, 100, 0.04) 100%\\n  );\\n  box-shadow: 0 0 18px rgba(96, 165, 250, 0.24);\\n}\\n\\n.dc-option:hover {\\n  transform: translateX(12px) scale(1.01);\\n  background: linear-gradient(\\n    90deg,\\n    rgba(96, 165, 250, 0.28) 0%,\\n    rgba(125, 211, 252, 0.12) 55%,\\n    rgba(198, 166, 100, 0.06) 100%\\n  );\\n  border-left: 3px solid rgba(147, 197, 253, 1);\\n  box-shadow: -6px 0 26px rgba(96, 165, 250, 0.4);\\n}\\n\\n.fight-tag,\\n.dc-tag {\\n  display: inline-flex;\\n  align-items: center;\\n  justify-content: center;\\n  padding: 2px 8px;\\n  margin-right: 10px;\\n  border-radius: 999px;\\n  font-size: 0.8rem;\\n  letter-spacing: 2px;\\n}\\n\\n.fight-tag {\\n  background: rgba(239, 68, 68, 0.2);\\n  border: 1px solid rgba(239, 68, 68, 0.6);\\n  color: #ffd6d6;\\n}\\n\\n.dc-tag {\\n  background: rgba(96, 165, 250, 0.18);\\n  border: 1px solid rgba(147, 197, 253, 0.65);\\n  color: #d9efff;\\n  box-shadow: 0 0 10px rgba(96, 165, 250, 0.18);\\n}\\n\\n.option-badge {\\n  display: flex;\\n  justify-content: center;\\n  align-items: center;\\n  width: 28px;\\n  height: 28px;\\n  background: rgba(0, 0, 0, 0.5);\\n  border: 1px solid var(--bg3-gold);\\n  color: var(--bg3-gold);\\n  font-family: \'Outfit\', sans-serif;\\n  font-weight: 800;\\n  font-size: 0.9rem;\\n  border-radius: 4px;\\n  margin-right: 16px;\\n  flex-shrink: 0;\\n  transition: all 0.3s ease;\\n  transform: rotate(45deg);\\n}\\n\\n.option-badge span {\\n  transform: rotate(-45deg);\\n}\\n\\n.trpg-option:hover .option-badge {\\n  background: var(--kenshi-rust);\\n  color: #fff;\\n  border-color: var(--kenshi-rust);\\n  box-shadow: 0 0 12px var(--rust-glow);\\n}\\n\\n.option-text {\\n  flex-grow: 1;\\n  font-size: 1.05rem;\\n  letter-spacing: 0.5px;\\n  z-index: 1;\\n  line-height: 1.5;\\n}\\n\\n.ripple {\\n  display: none;\\n}\\n\\n.fade-in-up {\\n  animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;\\n}\\n\\n@keyframes fadeInUp {\\n  from {\\n    opacity: 0;\\n
